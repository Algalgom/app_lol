<div class="contacto-container">
  <div class="contacto-wrapper">
    
    <div class="contacto-info">
      <h2 class="gold-text">SOPORTE AL INVOCADOR</h2>
      <p class="subtitle">¿Tienes algún problema con la API, sugerencias o quieres colaborar en el proyecto? Déjanos un mensaje.</p>
      
      <div class="info-items">
        <div class="info-item">
          <i class="fa-solid fa-envelope gold-text"></i>
          <div>
            <h4>Correo Electrónico</h4>
            <p>soporte&#64;leaguestats.com</p>
          </div>
        </div>
        
        <div class="info-item">
          <i class="fa-brands fa-discord gold-text"></i>
          <div>
            <h4>Comunidad de Discord</h4>
            <p>join.discord.gg/leaguestats</p>
          </div>
        </div>

        <div class="info-item">
          <i class="fa-solid fa-code-branch gold-text"></i>
          <div>
            <h4>Contribuciones</h4>
            <p>github.com/leaguestats/frontend</p>
          </div>
        </div>
      </div>
    </div>

    <div class="contacto-form-container">
      <form class="contacto-form">
        
        <div class="form-group">
          <label for="name">Nombre de Invocador / Alias</label>
          <input type="text" id="name" placeholder="Ej. Faker">
        </div>

        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" placeholder="nombre&#64;correo.com">
        </div>

        <div class="form-group">
          <label for="subject">Asunto</label>
          <select id="subject">
            <option value="api">Error / Bug de la API</option>
            <option value="sugerencia">Sugerencia de diseño</option>
            <option value="colaboracion">Colaboración / Desarrollo</option>
            <option value="otro">Otro motivo</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">Mensaje</label>
          <textarea id="message" rows="5" placeholder="Escribe los detalles de tu consulta aquí..."></textarea>
        </div>

        <button type="button" class="btn-submit">
          ENVIAR MENSAJE
        </button>

      </form>
    </div>

  </div>
</div>
